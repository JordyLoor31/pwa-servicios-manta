services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: nest_backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - PORT=3000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-servicios_manta}
      - DB_PASS=${DB_PASS:-servicios_manta_2024}
      - DB_NAME=${DB_NAME:-servicios_manta}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: servicios_manta_db
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-servicios_manta}
      POSTGRES_PASSWORD: ${DB_PASS:-servicios_manta_2024}
      POSTGRES_DB: ${DB_NAME:-servicios_manta}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-servicios_manta} -d ${DB_NAME:-servicios_manta}"]
      interval: 5s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: vue_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - VITE_API_URL=http://localhost:3000

volumes:
  pgdata: